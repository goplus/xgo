name: PR Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  BuildRelease:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27.x

    - name: Build release packages
      uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: latest
        args: release --snapshot --clean --skip=docker,snapcraft,winget -p 4

    - name: Upload release packages
      uses: actions/upload-artifact@v7
      with:
        name: xgo-release-packages
        path: |
          .dist/*.tar.gz
          .dist/*.zip
          .dist/*.deb
          .dist/*.rpm
          .dist/*.checksums.txt
        include-hidden-files: true
        if-no-files-found: error
        compression-level: 0

  TestReleaseBuild:
    name: TestReleaseBuild (${{ matrix.package }})
    needs: BuildRelease
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-latest
          package: linux-amd64.deb
        - runner: ubuntu-24.04-arm
          package: linux-arm64.deb
        - runner: macos-15-intel
          package: darwin-amd64.tar.gz
        - runner: macos-15
          package: darwin-arm64.tar.gz
        - runner: windows-latest
          package: windows-amd64.zip
        - runner: windows-11-arm
          package: windows-arm64.zip
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_SUFFIX: ${{ matrix.package }}
    steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27.x
        cache: false

    - name: Download release packages
      uses: actions/download-artifact@v8
      with:
        name: xgo-release-packages
        path: ${{ runner.temp }}/xgo-release-packages

    - name: Install DEB
      if: runner.os == 'Linux'
      shell: bash
      run: |
        packages=("$RUNNER_TEMP/xgo-release-packages"/*."$PACKAGE_SUFFIX")
        test "${#packages[@]}" -eq 1
        test -f "${packages[0]}"
        sudo apt-get update
        sudo apt-get install -y "${packages[0]}"

    - name: Extract macOS tarball
      if: runner.os == 'macOS'
      shell: bash
      run: |
        packages=("$RUNNER_TEMP/xgo-release-packages"/*."$PACKAGE_SUFFIX")
        test "${#packages[@]}" -eq 1
        test -f "${packages[0]}"
        install_dir="$RUNNER_TEMP/xgo-install"
        mkdir "$install_dir"
        tar -xf "${packages[0]}" -C "$install_dir"
        printf '%s\n' "$install_dir/bin" >> "$GITHUB_PATH"

    - name: Extract Windows ZIP
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $packageDir = Join-Path $env:RUNNER_TEMP 'xgo-release-packages'
        $packages = @(Get-ChildItem -LiteralPath $packageDir -Filter "*.$env:PACKAGE_SUFFIX" -File)
        if ($packages.Count -ne 1) {
          throw "Expected one $env:PACKAGE_SUFFIX package, found $($packages.Count)."
        }
        $installDir = Join-Path $env:RUNNER_TEMP 'xgo-install'
        Expand-Archive -LiteralPath $packages[0].FullName -DestinationPath $installDir
        Join-Path $installDir 'bin' >> $env:GITHUB_PATH

    - name: Run Hello World on Linux and macOS
      if: runner.os == 'Linux' || runner.os == 'macOS'
      shell: bash
      env:
        XGO_COMMAND_PREFIX: ${{ runner.os == 'Linux' && '/usr/bin/' || '' }}
      run: |
        for xgo_command in xgo gop; do
          program_dir=$(mktemp -d "$RUNNER_TEMP/xgo-smoke-$xgo_command.XXXXXX")
          cd "$program_dir"
          printf '%s\n' 'echo "Hello, world!"' > hello.xgo
          hello_output=$("$XGO_COMMAND_PREFIX$xgo_command" run hello.xgo)
          printf '%s printed %s\n' "$xgo_command" "$hello_output"
          test "$hello_output" = 'Hello, world!'
        done

    - name: Run Hello World on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        foreach ($xgoCommand in 'xgo', 'gop') {
          $programDir = Join-Path $env:RUNNER_TEMP "xgo-smoke-$xgoCommand"
          New-Item -ItemType Directory -Path $programDir | Out-Null
          Set-Location -LiteralPath $programDir
          Set-Content -Path hello.xgo -Value 'echo "Hello, world!"' -Encoding utf8NoBOM
          $helloOutput = (& $xgoCommand run hello.xgo) -join "`n"
          Write-Output "$xgoCommand printed $helloOutput"
          if ($helloOutput -cne 'Hello, world!') {
            throw "Unexpected Hello World output from $xgoCommand."
          }
        }
