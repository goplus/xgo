name: PR Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  BuildRelease:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Snapcraft
      uses: samuelmeuli/action-snapcraft@v3

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27.x

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build release packages
      uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: latest
        args: release --snapshot --clean --skip=publish -p 4

    - name: Check Snap packages
      shell: bash
      run: |
        for arch in 386 amd64 arm64; do
          packages=(.dist/*.linux-"$arch".snap)
          if [ "${#packages[@]}" -ne 1 ] || [ ! -s "${packages[0]}" ]; then
            echo "Expected one nonempty Snap package for linux/$arch."
            exit 1
          fi
          ls -lh "${packages[0]}"
        done

    - name: Check WinGet manifests
      shell: bash
      run: |
        python -m pip install --no-input pyyaml
        python - <<'PY'
        import hashlib
        from pathlib import Path

        import yaml

        dist = Path('.dist')
        manifest_types = {
            'goplus.xgo.yaml': 'version',
            'goplus.xgo.installer.yaml': 'installer',
            'goplus.xgo.locale.en-US.yaml': 'defaultLocale',
        }
        manifests = {}
        for filename, manifest_type in manifest_types.items():
            files = list(dist.glob(f'winget/**/{filename}'))
            if len(files) != 1:
                raise SystemExit(f'Expected one {filename}, found {len(files)}.')
            manifest = yaml.safe_load(files[0].read_text(encoding='utf-8'))
            if manifest['ManifestType'] != manifest_type:
                raise SystemExit(f'Unexpected manifest type in {files[0]}.')
            manifests[manifest_type] = manifest

        installers = manifests['installer']['Installers']
        if sorted(item['Architecture'] for item in installers) != ['arm64', 'x64', 'x86']:
            raise SystemExit('Expected WinGet installers for arm64, x64, and x86.')
        for item in installers:
            aliases = {file['PortableCommandAlias'] for file in item['NestedInstallerFiles']}
            if aliases != {'xgo', 'gop'}:
                raise SystemExit(f"Unexpected command aliases for {item['Architecture']}: {aliases}")
            archive = dist / item['InstallerUrl'].rsplit('/', 1)[-1]
            with archive.open('rb') as package:
                sha256 = hashlib.file_digest(package, 'sha256').hexdigest()
            if sha256 != item['InstallerSha256'].lower():
                raise SystemExit(f'WinGet checksum does not match {archive}.')
            print(f"Verified WinGet installer for {item['Architecture']}: {archive.name}")
        PY

    - name: Upload release packages
      uses: actions/upload-artifact@v7
      with:
        name: xgo-release-packages
        path: |
          .dist/*.tar.gz
          .dist/*.zip
          .dist/*.deb
          .dist/*.rpm
          .dist/*.snap
          .dist/*.checksums.txt
          .dist/winget/**/*.yaml
        include-hidden-files: true
        if-no-files-found: error
        compression-level: 0

  TestReleaseBuild:
    name: TestReleaseBuild (${{ matrix.package }}${{ matrix.winget_arch && ' via WinGet' || '' }})
    needs: BuildRelease
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-latest
          package: linux-amd64.deb
        - runner: ubuntu-24.04-arm
          package: linux-arm64.deb
        - runner: ubuntu-latest
          package: linux-amd64.snap
        - runner: ubuntu-24.04-arm
          package: linux-arm64.snap
        - runner: macos-15-intel
          package: darwin-amd64.tar.gz
        - runner: macos-15
          package: darwin-arm64.tar.gz
        - runner: windows-latest
          package: windows-amd64.zip
        - runner: windows-11-arm
          package: windows-arm64.zip
        - runner: windows-latest
          package: windows-amd64.zip
          winget_arch: x64
        - runner: windows-11-arm
          package: windows-arm64.zip
          winget_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_SUFFIX: ${{ matrix.package }}
    steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27.x
        cache: false

    - name: Download release packages
      uses: actions/download-artifact@v8
      with:
        name: xgo-release-packages
        path: ${{ runner.temp }}/xgo-release-packages

    - name: Install DEB
      if: endsWith(matrix.package, '.deb')
      shell: bash
      run: |
        packages=("$RUNNER_TEMP/xgo-release-packages"/*."$PACKAGE_SUFFIX")
        test "${#packages[@]}" -eq 1
        test -f "${packages[0]}"
        sudo apt-get update
        sudo apt-get install -y "${packages[0]}"

    - name: Install Snap and run Hello World
      if: endsWith(matrix.package, '.snap')
      shell: bash
      run: |
        packages=("$RUNNER_TEMP/xgo-release-packages"/*."$PACKAGE_SUFFIX")
        test "${#packages[@]}" -eq 1
        test -f "${packages[0]}"
        sudo apt-get update
        sudo apt-get install -y snapd
        sudo timeout 180s snap wait system seed.loaded
        sudo snap install --dangerous --classic "${packages[0]}"

        program_dir=$(mktemp -d "$RUNNER_TEMP/xgo-snap-smoke.XXXXXX")
        cd "$program_dir"
        printf '%s\n' 'echo "Hello, world!"' > hello.xgo
        hello_output=$(snap run xgo run hello.xgo)
        printf 'Installed xgo Snap printed %s\n' "$hello_output"
        test "$hello_output" = 'Hello, world!'

    - name: Extract macOS tarball
      if: runner.os == 'macOS'
      shell: bash
      run: |
        packages=("$RUNNER_TEMP/xgo-release-packages"/*."$PACKAGE_SUFFIX")
        test "${#packages[@]}" -eq 1
        test -f "${packages[0]}"
        install_dir="$RUNNER_TEMP/xgo-install"
        mkdir "$install_dir"
        tar -xf "${packages[0]}" -C "$install_dir"
        printf '%s\n' "$install_dir/bin" >> "$GITHUB_PATH"

    - name: Extract Windows ZIP
      if: runner.os == 'Windows' && !matrix.winget_arch
      shell: pwsh
      run: |
        $packageDir = Join-Path $env:RUNNER_TEMP 'xgo-release-packages'
        $packages = @(Get-ChildItem -LiteralPath $packageDir -Filter "*.$env:PACKAGE_SUFFIX" -File)
        if ($packages.Count -ne 1) {
          throw "Expected one $env:PACKAGE_SUFFIX package, found $($packages.Count)."
        }
        $installDir = Join-Path $env:RUNNER_TEMP 'xgo-install'
        Expand-Archive -LiteralPath $packages[0].FullName -DestinationPath $installDir
        Join-Path $installDir 'bin' >> $env:GITHUB_PATH

    - name: Set up WinGet
      if: matrix.winget_arch
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
          Install-PackageProvider -Name NuGet -Force | Out-Null
          Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery
          Repair-WinGetPackageManager -AllUsers
        }
        winget --version
        winget settings --enable LocalManifestFiles

    - name: Install PR package with WinGet
      if: matrix.winget_arch
      shell: pwsh
      env:
        WINGET_ARCH: ${{ matrix.winget_arch }}
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $packageDir = Join-Path $env:RUNNER_TEMP 'xgo-release-packages'
        $installers = @(Get-ChildItem -LiteralPath (Join-Path $packageDir 'winget') -Recurse -File -Filter 'goplus.xgo.installer.yaml')
        if ($installers.Count -ne 1) {
          throw "Expected one WinGet installer manifest, found $($installers.Count)."
        }

        $manifestDir = Join-Path $env:RUNNER_TEMP 'xgo-winget-manifests'
        Copy-Item -LiteralPath $installers[0].DirectoryName -Destination $manifestDir -Recurse
        $installerManifest = Join-Path $manifestDir $installers[0].Name
        $manifest = Get-Content -LiteralPath $installerManifest -Raw
        # Serve unpublished ZIPs such as xgo*.windows-amd64.zip from this runner.
        $installerUrls = [regex]'(?m)^([ \t]*InstallerUrl:[ \t]+)https://\S+/([^/\s]+\.zip)(?=\r?$)'
        if ($installerUrls.Matches($manifest).Count -ne 3) {
          throw 'Expected three WinGet installer URLs for the snapshot ZIPs.'
        }
        $localManifest = $installerUrls.Replace($manifest, '${1}http://127.0.0.1:8765/${2}')
        Set-Content -LiteralPath $installerManifest -Value $localManifest -Encoding utf8NoBOM -NoNewline

        $server = Start-Process -FilePath python -WorkingDirectory $packageDir -NoNewWindow -PassThru `
          -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1'
        try {
          for ($attempt = 1; $attempt -le 15; $attempt++) {
            try {
              Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -Method Head -TimeoutSec 2 | Out-Null
              break
            } catch {
              if ($server.HasExited -or $attempt -eq 15) { throw }
              Start-Sleep -Seconds 1
            }
          }
          winget install --manifest $manifestDir --architecture $env:WINGET_ARCH --scope user `
            --accept-source-agreements --accept-package-agreements --disable-interactivity
        } finally {
          if (-not $server.HasExited) { Stop-Process -Id $server.Id }
        }
        Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links' >> $env:GITHUB_PATH

    - name: Run Hello World on Linux and macOS
      if: endsWith(matrix.package, '.deb') || runner.os == 'macOS'
      shell: bash
      env:
        XGO_COMMAND_PREFIX: ${{ runner.os == 'Linux' && '/usr/bin/' || '' }}
      run: |
        for xgo_command in xgo gop; do
          program_dir=$(mktemp -d "$RUNNER_TEMP/xgo-smoke-$xgo_command.XXXXXX")
          cd "$program_dir"
          printf '%s\n' 'echo "Hello, world!"' > hello.xgo
          hello_output=$("$XGO_COMMAND_PREFIX$xgo_command" run hello.xgo)
          printf '%s printed %s\n' "$xgo_command" "$hello_output"
          test "$hello_output" = 'Hello, world!'
        done

    - name: Run Hello World on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        foreach ($xgoCommand in 'xgo', 'gop') {
          $programDir = Join-Path $env:RUNNER_TEMP "xgo-smoke-$xgoCommand"
          New-Item -ItemType Directory -Path $programDir | Out-Null
          Set-Location -LiteralPath $programDir
          Set-Content -Path hello.xgo -Value 'echo "Hello, world!"' -Encoding utf8NoBOM
          $helloOutput = (& $xgoCommand run hello.xgo) -join "`n"
          Write-Output "$xgoCommand printed $helloOutput"
          if ($helloOutput -cne 'Hello, world!') {
            throw "Unexpected Hello World output from $xgoCommand."
          }
        }
